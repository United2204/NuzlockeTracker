spring:
  datasource:
    url: jdbc:postgresql://localhost:5435/nuzlocke_tracker_dev
    username: ${DB_USERNAME:nuzlocke}
    password: ${DB_PASSWORD:nuzlocke}
  jpa:
    show-sql: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ''
    password: ''
    properties:
      mail:
        smtp:
          auth: false       # Mailpit no requiere autenticación
          starttls:
            enable: false
  mvc:
    problemdetails:
      enabled: false  # nuestro GlobalExceptionHandler maneja las validaciones
  # Para habilitar Google OAuth: agregar GOOGLE_CLIENT_ID y GOOGLE_CLIENT_SECRET en .env
  # y eliminar el bloque autoconfigure.exclude a continuación.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration

app:
  jwt:
    secret: 0IYUs21tmapPMG9MN5Qdh/bMmQkdMtgKYjxlSQRb/iA=
  frontend-url: http://localhost:5173
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174
  seed:
    pokemon: true   # carga gen 1-6 desde PokéAPI al arrancar (solo si la tabla está vacía)

management:
  health:
    mail:
      enabled: false

logging:
  level:
    com.nuzlocketracker: DEBUG
    org.springframework.security: DEBUG
    org.flywaydb: DEBUG
