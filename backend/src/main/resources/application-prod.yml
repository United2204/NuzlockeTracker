spring:
  jpa:
    show-sql: false
  mail:
    properties:
      mail:
        smtp:
          starttls:
            enable: false
          ssl:
            enable: true

app:
  mail:
    from: ${MAIL_FROM}
  seed:
    pokemon: false
    evolutions: false

management:
  health:
    mail:
      enabled: false

logging:
  level:
    com.nuzlocketracker: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO
